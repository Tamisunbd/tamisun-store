<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMISUN - Kids' Fashion Redefined</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        .product-card { background: #111; border: 1px solid #222; border-radius: 12px; overflow: hidden; transition: 0.3s; }
        .product-card:hover { border-color: #444; }
    </style>
</head>
<body>

    <header class="py-6 text-center border-b border-gray-800">
        <h1 class="text-3xl font-bold tracking-widest">TAMISUN</h1>
    </header>

    <section class="py-12 text-center px-4">
        <h2 class="text-4xl font-extrabold mb-2">Kids' Fashion Redefined</h2>
        <p class="text-gray-400">Premium Drop-shoulder Tees & More</p>
    </section>

    <main class="max-w-6xl mx-auto px-4 pb-20">
        <h3 class="text-xl font-semibold mb-8 border-l-4 border-white pl-3">Our Collection</h3>
        
        <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <p class="col-span-full text-center py-10 text-gray-500">Loading products...</p>
        </div>
    </main>

    <footer class="py-10 text-center border-t border-gray-900 text-gray-600 text-sm">
        <p>&copy; 2026 TAMISUN Store. All Rights Reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://rbmdgpyvznfjokzinxje.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJibWRncHl2em5mam9remlueGplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4Njg2MjksImV4cCI6MjA5NDQ0NDYyOX0.QCDR49iTHo1RNUzSRcz3a_13hT6l_T8f4AXFiF0kaa8";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchProducts() {
            const list = document.getElementById('product-list');
            try {
                const { data, error } = await _supabase.from('products').select('*');
                if (error) throw error;

                if (!data || data.length === 0) {
                    list.innerHTML = "<p class='col-span-full text-center'>No products found in Supabase.</p>";
                    return;
                }

                list.innerHTML = data.map(product => `
                    <div class="product-card p-3 flex flex-col justify-between">
                        <div>
                            <img src="${product.image}" class="rounded-lg mb-3 w-full aspect-square object-cover bg-gray-900" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400?text=No+Image'">
                            <h4 class="font-medium text-sm mb-1">${product.name}</h4>
                            <p class="text-yellow-500 font-bold mb-3">৳ ${product.price}</p>
                        </div>
                        <button onclick="orderNow('${product.name}', ${product.price})" 
                            class="w-full bg-white text-black text-xs font-bold py-2.5 rounded-md hover:bg-gray-200 transition-all">
                            ORDER NOW
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = "<p class='col-span-full text-center text-red-500'>Error loading products.</p>";
            }
        }

        function orderNow(name, price) {
            const customer = prompt("Enter Name & Phone Number for " + name + ":");
            if (!customer) return;
            saveOrder(customer, name, price);
        }

        async function saveOrder(customer, prodName, price) {
            const { error } = await _supabase.from('orders').insert([
                { customer_name: customer, product_name: prodName, total_price: price, status: 'pending' }
            ]);
            if (error) alert("Order failed!");
            else alert("Order successful! We will call you soon.");
        }

        fetchProducts();
    </script>
</body>
</html>
